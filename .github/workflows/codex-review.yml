name: Codex PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  codex-review:
    name: Codex review
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout pull request merge
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      - name: Checkout current ref
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/checkout@v5

      - name: Pre-fetch base and head refs
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git fetch --no-tags origin \
            "+refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}" \
            "+refs/pull/${{ github.event.pull_request.number }}/head"

      - name: Skip when OPENAI_API_KEY is unavailable
        if: ${{ env.OPENAI_API_KEY == '' }}
        run: echo "OPENAI_API_KEY is not configured; skipping Codex review."

      - name: Prepare trusted Codex prompt
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git show "refs/remotes/origin/${{ github.event.pull_request.base.ref }}:.github/codex/prompts/review.md" > .github/codex/prompts/review.trusted.md
          else
            cp .github/codex/prompts/review.md .github/codex/prompts/review.trusted.md
          fi

      - name: Run Codex review
        id: run_codex
        if: ${{ env.OPENAI_API_KEY != '' }}
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ env.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/review.trusted.md
          output-file: codex-output.md
          safety-strategy: drop-sudo
          sandbox: workspace-write

      - name: Post Codex feedback
        if: ${{ github.event_name == 'pull_request' && steps.run_codex.outputs.final-message != '' }}
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ steps.run_codex.outputs.final-message }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: process.env.CODEX_FINAL_MESSAGE,
            });
