name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  site:
    name: Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install site dependencies
        run: bun install --cwd site --frozen-lockfile

      - name: Test
        run: bun run site:test

      - name: Typecheck
        run: bun run site:typecheck

      - name: Build
        run: bun run site:build

  move:
    name: Sui Move
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history needed to diff against the PR base commit below.
          fetch-depth: 0

      # Skip the expensive toolchain install/build for PRs that don't touch
      # registry/move/**, but always run on push (keeps main green-checked)
      # and workflow_dispatch.
      - name: Determine whether to run
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
              | grep -qE '^(registry/move/|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.run == 'true'
        with:
          bun-version: 1.3.1

      - name: Install suiup
        if: steps.gate.outputs.run == 'true'
        run: |
          cargo install --git https://github.com/MystenLabs/suiup.git --rev a65c6923fe84562660e933a2dd12849de77a07b1 --locked suiup
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Sui CLI
        if: steps.gate.outputs.run == 'true'
        run: suiup install -y sui@testnet-1.66.2

      - name: Build Move package
        if: steps.gate.outputs.run == 'true'
        run: bun run move:build

      - name: Test Move package
        if: steps.gate.outputs.run == 'true'
        run: bun run move:test
