name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  site:
    name: Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install site dependencies
        run: bun install --cwd site --frozen-lockfile

      - name: Test
        run: bun run site:test

      - name: Typecheck
        run: bun run site:typecheck

      - name: Build
        run: bun run site:build

  move:
    name: Sui Move
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install suiup
        run: |
          cargo install --git https://github.com/MystenLabs/suiup.git --rev a65c6923fe84562660e933a2dd12849de77a07b1 --locked suiup
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Sui CLI
        run: suiup install -y sui@testnet-1.66.2

      - name: Build Move package
        run: bun run move:build

      - name: Test Move package
        run: bun run move:test
